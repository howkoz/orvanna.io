       handoff: it stopped the lockup sitting on any ground but white. -->
  <!-- Hex Team badge -->
  <g transform="translate(20,22)">
    <polygon points="28,0 52.2,14 52.2,42 28,56 3.8,42 3.8,14" fill="none" stroke="#4F46E5" stroke-width="5" stroke-linejoin="round"/>
