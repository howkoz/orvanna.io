<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Orvanna favicon. The 16px optical cut: thickest bars, deepest inset,
       so the pinwheel survives rasterisation at tab size instead of
       collapsing into a smudge. Four rectangles in 90 degree rotational
       symmetry, one of them accented, turning around a central gap.

       This is the ONE drawing that keeps a ground. A favicon is composited
       onto a browser chrome we do not control and cannot inherit a page
       colour, so ink bars alone would vanish on a dark tab strip. The
       square is paper, not white, and carries no radius. -->
  <rect width="64" height="64" fill="#EAE4D9"/>
  <rect x="30.5" y="4.5" width="29" height="15.5" fill="#EC3013"/>
  <rect x="44" y="32" width="15.5" height="29" fill="#1B1917"/>
  <rect x="4.5" y="44" width="29" height="15.5" fill="#1B1917"/>
  <rect x="4.5" y="4.5" width="15.5" height="29" fill="#1B1917"/>
</svg>
