<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orvanna Member Portal, Demo Mode</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/portal.css?v=5.2">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img id="logoImg" src="assets/logo-header-dark.svg" alt="Orvanna" class="brand-logo">
      <span class="demo-pill" title="Every account, order, and payout on this site is synthetic.">DEMO MODE</span>
    </div>
    <nav class="site-links" aria-label="Orvanna sites">
      <a class="site-link" href="../index.html">Orvanna Home</a>
      <a class="site-link" href="../shop.html">Shop</a>
      <a class="site-link" href="../staff.html" title="Staff call console (demonstration; it needs the staff sign-in)">Staff</a>
      <button class="site-link site-support" type="button" data-orvanna-support>Support</button>
      <a class="site-link" id="signOutLink" href="../index.html" title="End this portal session and return to the Orvanna home page">Sign out</a>
    </nav>
    <div class="controls">
      <div class="control picker-wrap">
        <label class="control-label" for="memberSearch">Viewing as</label>
        <input id="memberSearch" class="picker-input" type="text" autocomplete="off"
               spellcheck="false" placeholder="Search member code or name">
        <div id="memberList" class="picker-list" hidden></div>
      </div>
      <div class="control">
        <label class="control-label" for="periodSelect">Period</label>
        <select id="periodSelect" class="period-select" aria-label="Volume period"></select>
      </div>
      <button id="themeBtn" class="theme-btn" type="button" aria-label="Switch between dark and light theme">
        <span id="themeIcon" aria-hidden="true">&#9788;</span>
      </button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Portal sections">
  <button class="tab active" data-tab="team"      type="button">My Team</button>
  <button class="tab" data-tab="volume"    type="button">My Volume</button>
  <button class="tab" data-tab="rank"      type="button">My Rank</button>
  <button class="tab" data-tab="statement" type="button">My Statement</button>
  <button class="tab" data-tab="company"   type="button">Company</button>
</nav>

<main id="main">
  <section id="panel-team"      class="panel active"><div class="panel-body"></div></section>
  <section id="panel-volume"    class="panel"><div class="panel-body"></div></section>
  <section id="panel-rank"      class="panel"><div class="panel-body"></div></section>
  <section id="panel-statement" class="panel"><div class="panel-body"></div></section>
  <section id="panel-company"   class="panel"><div class="panel-body"></div></section>
</main>

<footer id="footer" class="footer">Synthetic demo data &middot; loading&hellip;</footer>

<script>
/* ---------- session gate ----------
   Runs before the portal's own script is even requested, so a
   visitor without a valid member session triggers no database
   call. The token was signed by the server; the browser cannot
   mint or edit one. This gate is inlined rather than shared with
   the staff console because the two pages live in folders the
   deploy script moves apart, and a shared file would need a path
   that survives that move. */
(function () {
  'use strict';

  var SESSION_KEY = 'orvanna_session';
  var SIGN_IN_URL = '../login.html?role=admin';

  function readSession() {
    try {
      return JSON.parse(window.sessionStorage.getItem(SESSION_KEY));
    } catch (e) {
      return null;
    }
  }
  function clearSession() {
    try { window.sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* nothing to clear */ }
  }

  var s = readSession();
  var valid = !!(s && s.token && s.role === 'admin' &&
    Number(s.expires_at) * 1000 > Date.now());
  if (!valid) {
    clearSession();
    window.location.replace(SIGN_IN_URL);
    return;                       /* the portal script is never loaded */
  }

  document.getElementById('signOutLink').addEventListener('click', clearSession);

  var portal = document.createElement('script');
  portal.src = 'js/app.js?v=5.2';
  document.body.appendChild(portal);
})();
</script>
<!-- ============ SUPPORT CHAT (Botpress, hosted) ============
     The second sanctioned external script after HyperLoader.js, recorded in
     ROADMAP.md. Nav triggered on purpose: the vendor's floating action button
     is hidden in the stylesheet, so nothing can open itself over the cart
     control on a phone or over the card form during checkout. Conversation
     text is handled by Botpress, a third party. -->
<script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/08/14/20/20260814201237-9JS9TWQ7.js" defer></script>
<script>
(function () {
  var triggers = document.querySelectorAll('[data-orvanna-support]');
  if (!triggers.length) return;
  var wantOpen = false, listening = false;

  function openNow() {
    if (window.botpress && typeof window.botpress.open === 'function') {
      try { window.botpress.open(); return true; } catch (err) { return false; }
    }
    return false;
  }

  /* The widget arrives asynchronously. Watch for it, and if someone pressed
     Support before it was ready, open the moment it reports ready. */
  var waited = 0;
  var poll = window.setInterval(function () {
    if (!listening && window.botpress && typeof window.botpress.on === 'function') {
      listening = true;
      window.clearInterval(poll);
      window.botpress.on('webchat:ready', function () {
        if (wantOpen) { wantOpen = false; openNow(); }
      });
    } else if ((waited += 250) > 20000) {
      window.clearInterval(poll);
    }
  }, 250);

  Array.prototype.forEach.call(triggers, function (trigger) {
    trigger.addEventListener('click', function (event) {
      event.preventDefault();
      if (!openNow()) { wantOpen = true; }
    });
  });
})();
</script>
</body>
</html>
