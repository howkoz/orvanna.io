<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orvanna Sign In</title>
<meta name="description" content="Orvanna member sign in. Demonstration environment: any credentials continue.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/corporate.css?v=4.1">
</head>
<body class="login-body">

<a class="login-logo" href="index.html" aria-label="Orvanna home">
  <img src="assets/logo-header-dark.svg" alt="Orvanna">
</a>

<div class="login-card glass glass-cyan">
  <span class="accent-bar bar-cyan" aria-hidden="true"></span>

  <div class="login-badge" aria-hidden="true">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <polygon points="32,4 56.2,18 56.2,46 32,60 7.8,46 7.8,18"
               fill="none" stroke="#818CF8" stroke-width="4" stroke-linejoin="round"/>
      <line x1="32" y1="32" x2="32" y2="17" stroke="#818CF8" stroke-width="2.2"/>
      <line x1="32" y1="32" x2="20" y2="42" stroke="#818CF8" stroke-width="2.2"/>
      <line x1="32" y1="32" x2="44" y2="42" stroke="#818CF8" stroke-width="2.2"/>
      <circle cx="32" cy="17" r="3.8" fill="#818CF8"/>
      <circle cx="20" cy="42" r="3.8" fill="#818CF8"/>
      <circle cx="44" cy="42" r="3.8" fill="#818CF8"/>
      <circle cx="32" cy="32" r="4.5" fill="#22D3EE"/>
    </svg>
  </div>

  <h1 class="login-title">Member sign in</h1>

  <form class="login-form" id="loginForm" novalidate>
    <label class="field-label" for="username">Username</label>
    <input class="field" type="text" id="username" name="username" autocomplete="off" spellcheck="false">
    <label class="field-label" for="password">Password</label>
    <input class="field" type="password" id="password" name="password" autocomplete="off">
    <button class="btn btn-solid btn-block" type="submit">Continue</button>
  </form>

  <p class="login-note">Demonstration environment: any credentials continue.</p>
  <a class="login-back" href="index.html">Back</a>
</div>

<p class="login-legal">Orvanna is a demonstration company. All data is synthetic. No real earnings, products, or offers exist.</p>

<script>
/* Demonstration sign in: no validation, no storage, no real
   authentication. Continue always opens the member portal. */
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  window.location.href = 'portal/index.html';
});
</script>

</body>
</html>
